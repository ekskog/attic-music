apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-images
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-images
  template:
    metadata:
      labels:
        app: artist-images
    spec:
      containers:
        - name: artist-images
          image: ghcr.io/ekskog/artist-images:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MUSIC_ROOT
              value: /media/music
          volumeMounts:
            - name: music
              mountPath: /media/music
      volumes:
        - name: music
          nfs:
            server: 192.168.1.8
            path: /var/lib/media/music/mp3
---
apiVersion: v1
kind: Service
metadata:
  name: artist-images
  namespace: webapps
spec:
  selector:
    app: artist-images
  ports:
    - port: 8080
      targetPort: 8080
