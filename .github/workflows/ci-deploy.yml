name: "CI Build & Deploy"

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Set image output
        id: set-image
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update image in k8s/deployment manifest
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          if [ -f "k8s/deployment.yaml" ]; then
            sed -i.bak -E "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml || true
          fi

      - name: Apply Kubernetes manifests
        run: |
          for f in k8s/*.yaml; do
            if [ -f "$f" ]; then
              echo "applying $f"
              kubectl apply -f "$f" || exit 1
            fi
          done

      - name: Set deployment image and wait for rollout
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          # Update the deployment image if deployment exists
          if kubectl get deployment attic-music -n webapps >/dev/null 2>&1; then
            echo "Setting deployment image to ${IMAGE}"
            kubectl set image deployment/attic-music attic=${IMAGE} -n webapps || true
            echo "Waiting for rollout to finish"
            kubectl rollout status deployment/attic-music -n webapps --timeout=120s || true
          else
            echo "Deployment attic-music not found in namespace webapps; skipping image set"
          fi
