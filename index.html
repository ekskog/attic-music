<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attic</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F8F6F2;
      --surface: #FFFFFF;
      --border: #E5E2DC;
      --text: #1C1C1A;
      --text-muted: #8A887F;
      --accent: #B85C38;
      --accent-light: #F2E8E3;
      --sidebar-w: 240px;
      --player-h: 90px;
      --mobile-header-h: 60px;
    }

    body { 
      font-family: 'DM Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      overflow: hidden; 
      -webkit-tap-highlight-color: transparent;
    }

    /* LOGIN */
    .login { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; overflow-y: auto; }
    .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); padding: 40px; }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; margin-bottom: 4px; }
    .login-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--border); background: var(--bg); padding: 12px; font-family: inherit; font-size: 14px; outline: none; }
    .btn-primary { width: 100%; background: var(--text); color: white; border: none; padding: 14px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary:disabled { opacity: 0.5; }
    .error-msg { color: var(--accent); font-size: 13px; margin-top: 12px; text-align: center; }

    /* LAYOUT */
    .app { display: flex; height: 100vh; position: relative; }
    .mobile-header { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--mobile-header-h); background: var(--surface); border-bottom: 1px solid var(--border); z-index: 100; align-items: center; padding: 0 16px; justify-content: space-between; }
    
    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; transition: transform 0.3s ease; z-index: 1001; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; }

    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100vh; }
    .content-scroll { flex: 1; overflow-y: auto; padding: 24px; padding-bottom: 160px; -webkit-overflow-scrolling: touch; }

    /* PLAYER */
    .player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 200; }

    /* RESPONSIVE */
    @media (max-width: 850px) {
      .mobile-header { display: flex; }
      .sidebar { position: fixed; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .content { padding-top: var(--mobile-header-h); }
      .player { height: 130px; flex-direction: column; justify-content: center; padding: 10px; }
    }
  </style>
</head>
<body>
<div id="app">

  <div v-if="!loggedIn" class="login">
    <div class="login-card">
      <div class="login-title">Attic</div>
      <div class="login-subtitle">Connect to your Subsonic server</div>
      
      <div class="field">
        <label>Server URL</label>
        <input v-model="loginForm.server" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Username</label>
        <input v-model="loginForm.username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input v-model="loginForm.password" type="password" />
      </div>

      <div style="margin: 20px 0; border-top: 1px solid var(--border); padding-top: 20px;">
        <div class="field">
          <label>Last.fm User (Optional)</label>
          <input v-model="loginForm.lastfmUser" />
        </div>
        <div class="field">
          <label>Last.fm API Key (Optional)</label>
          <input v-model="login
