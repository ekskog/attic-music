<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attic</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F8F6F2;
      --surface: #FFFFFF;
      --border: #E5E2DC;
      --text: #1C1C1A;
      --text-muted: #8A887F;
      --accent: #B85C38;
      --accent-light: #F2E8E3;
      --sidebar-w: 240px;
      --player-h: 80px;
      --mobile-header-h: 60px;
    }

    body { 
      font-family: 'DM Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      overflow: hidden; 
      -webkit-tap-highlight-color: transparent;
    }

    /* LOGIN */
    .login { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); padding: 48px 40px; }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; margin-bottom: 4px; }
    .login-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--border); background: var(--bg); padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; }
    .btn-primary { width: 100%; background: var(--text); color: white; border: none; padding: 12px; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 8px; }

    /* MAIN LAYOUT */
    .app { display: flex; height: 100vh; position: relative; }

    /* MOBILE HEADER */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--mobile-header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 90;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
    }
    .menu-trigger { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); }

    /* SIDEBAR */
    .sidebar { 
      width: var(--sidebar-w); 
      background: var(--surface); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0; 
      height: 100vh; 
      overflow: hidden; 
      z-index: 1000;
      transition: transform 0.3s ease;
    }
    .sidebar-header { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .app-name { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; }
    .nav { padding: 16px 0; flex-shrink: 0; }
    .nav-section { padding: 0 16px; margin-bottom: 4px; }
    .nav-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); padding: 8px 8px 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--text); transition: all 0.1s; }
    .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

    /* CONTENT */
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100vh; background: var(--bg); }
    .content-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .content-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; }
    .content-scroll { flex: 1; overflow-y: auto; padding: 24px 32px; padding-bottom: calc(var(--player-h) + 40px); -webkit-overflow-scrolling: touch; }

    /* LISTS & GRIDS */
    .dir-list { display: flex; flex-direction: column; gap: 1px; }
    .dir-item { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; border-radius: 4px; font-size: 14px; }
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .album-card { cursor: pointer; }
    .album-cover { width: 100%; aspect-ratio: 1; background: var(--accent-light); margin-bottom: 10px; overflow: hidden; position: relative; }
    .album-cover img { width: 100%; height: 100%; object-fit: cover; }

    /* TRACK LIST */
    .track-list-header { display: grid; grid-template-columns: 36px 1fr 140px 56px 32px; gap: 8px; padding: 0 12px 8px; font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .track-item { display: grid; grid-template-columns: 36px 1fr 140px 56px 32px; gap: 8px; padding: 10px 12px; border-radius: 4px; cursor: pointer; align-items: center; font-size: 14px; }
    .track-item.playing { color: var(--accent); }

    /* PLAYER */
    .player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 20px; z-index: 100; transition: height 0.3s ease; }
    .player-track { display: flex; align-items: center; gap: 12px; width: 280px; flex-shrink: 0; overflow: hidden; }
    .player-cover { width: 48px; height: 48px; background: var(--accent-light); flex-shrink: 0; overflow: hidden; }
    .player-cover img { width: 100%; height: 100%; object-fit: cover; }
    .player-info { overflow: hidden; }
    .player-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-controls { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .player-buttons { display: flex; align-items: center; gap: 16px; }
    .play-pause-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: white; border: none; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
    .progress-bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 480px; }
    .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; position: relative; cursor: pointer; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
    .player-right { width: 120px; display: flex; justify-content: flex-end; }

    /* MOBILE OVERLAY */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 999; }

    /* --- RESPONSIVE ADJUSTMENTS --- */
    @media (max-width: 850px) {
      .sidebar { position: fixed; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .mobile-header { display: flex; }
      .content { padding-top: var(--mobile-header-h); }
      .content-header { padding: 20px; }
      .content-scroll { padding: 16px; padding-bottom: 140px; }

      /* Hide complex columns */
      .track-list-header { display: none; }
      .track-item { grid-template-columns: 30px 1fr 50px 30px; }
      .track-item span:nth-child(3) { display: none; } /* Hide Artist column */
      
      .album-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

      /* Mobile Player Layout */
      .player { height: 120px; flex-direction: column; padding: 12px; gap: 8px; }
      .player-track { width: 100%; justify-content: center; text-align: center; }
      .player-controls { width: 100%; }
      .player-right { display: none; } /* Hide queue toggle to save space */
      .progress-bar { max-width: none; }
    }

    /* SCROBBLES */
    .scrobbles { padding: 12px 16px; border-top: 1px solid var(--border); flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .scrobbles-list { overflow-y: auto; flex: 1; }
    .scrobble-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .scrobble-track { font-size: 12px; font-weight: 500; }
    .scrobble-artist { font-size: 11px; color: var(--text-muted); }

  </style>
</head>
<body>
<div id="app">

  <div v-if="!loggedIn" class="login">
    <div class="login-card">
      <div class="login-title">Attic</div>
      <div class="login-subtitle">Connect to your Subsonic server</div>
      <div class="field">
        <label for="server">Server URL</label>
        <input id="server" v-model="loginForm.server" placeholder="https://gonic.example.com" @keyup.enter="login" />
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" v-model="loginForm.username" autocomplete="username" @keyup.enter="login" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" v-model="loginForm.password" type="password" autocomplete="current-password" @keyup.enter="login" />
      </div>
      <button class="btn-primary" @click="login" :disabled="logging">
        {{ logging ? 'Connecting…' : 'Connect' }}
      </button>
      <div v-if="loginError" class="error-msg">{{ loginError }}</div>
    </div>
  </div>

  <div v-else class="app">

    <header class="mobile-header">
      <button class="menu-trigger" @click="mobileMenuOpen = true">☰</button>
      <div class="app-name">Attic</div>
      <div style="width: 24px;"></div>
    </header>

    <div class="sidebar-overlay" :class="{active: mobileMenuOpen}" @click="mobileMenuOpen = false"></div>

    <div class="sidebar" :class="{open: mobileMenuOpen}">
      <div class="sidebar-header">
        <div class="app-name">Attic</div>
        <div style="font-size: 10px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis;">{{ config.server }}</div>
      </div>

      <nav class="nav">
        <div class="nav-section">
          <div class="nav-label">Library</div>
          <div class="nav-item" :class="{active: view === 'folders'}" @click="setView('folders')">📁 Folders</div>
          <div class="nav-item" :class="{active: view === 'artists' || view === 'artist-detail'}" @click="setView('artists')">🎤 Artists</div>
          <div class="nav-item" :class="{active: view === 'albums' || view === 'album-detail'}" @click="setView('albums')">💿 Albums</div>
        </div>
      </nav>

      <div class="scrobbles" v-if="config.lastfmUser && config.lastfmKey">
        <div class="nav-label">Recent plays</div>
        <div class="scrobbles-list">
          <div v-for="(s, i) in recentScrobbles" :key="i" class="scrobble-item">
            <div class="scrobble-track">{{ s.track }}</div>
            <div class="scrobble-artist">{{ s.artist }}</div>
          </div>
        </div>
      </div>

      <div style="padding: 20px; border-top: 1px solid var(--border);">
        <button @click="logout" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;">Sign out</button>
      </div>
    </div>

    <div class="content">

      <template v-if="view === 'folders'">
        <div class="content-header">
          <div class="content-title">Library</div>
        </div>
        <div class="content-scroll">
          <div v-if="loading" class="loading">Loading…</div>
          <div v-else class="dir-list">
            <div v-for="item in currentDirItems" :key="item.id" class="dir-item" @click="handleDirItem(item)">
              <span>{{ item.isDir ? '📁' : '🎵' }}</span>
              <span style="flex:1">{{ item.title || item.name }}</span>
            </div>
          </div>
        </div>
      </template>

      <template v-else-if="view === 'artists'">
        <div class="content-header"><div class="content-title">Artists</div></div>
        <div class="content-scroll">
          <div v-for="group in artistIndex" :key="group.name">
            <div style="font-weight:bold; color:var(--accent); margin: 10px 0;">{{ group.name }}</div>
            <div class="dir-list">
              <div v-for="artist in group.artist" :key="artist.id" class="dir-item" @click="openArtist(artist)">
                {{ artist.name }}
              </div>
            </div>
          </div>
        </div>
      </template>

      <template v-else-if="view === 'albums'">
        <div class="content-header"><div class="content-title">Albums</div></div>
        <div class="content-scroll">
          <div class="album-grid">
            <div v-for="album in allAlbums" :key="album.id" class="album-card" @click="openAlbumFromList(album)">
              <div class="album-cover">
                <img v-if="album.coverArt" :src="coverUrl(album.coverArt)" />
              </div>
              <div style="font-size:13px; font-weight:500;">{{ album.name }}</div>
              <div style="font-size:11px; color:var(--text-muted);">{{ album.artist }}</div>
            </div>
          </div>
        </div>
      </template>

      <template v-else-if="view === 'album-detail'">
        <div class="content-header"><div class="content-title">{{ currentAlbum?.name }}</div></div>
        <div class="content-scroll">
          <div v-for="(track, i) in albumTracks" :key="track.id" class="track-item" @click="playTrack(track, albumTracks, i)">
            <span style="color:var(--text-muted)">{{ i+1 }}</span>
            <span style="flex:1">{{ track.title }}</span>
            <span style="color:var(--text-muted)">{{ fmt(track.duration) }}</span>
          </div>
        </div>
      </template>

    </div>

    <div class="player" v-if="currentTrack">
      <div class="player-track">
        <div class="player-cover">
          <img v-if="currentTrack.coverArt" :src="coverUrl(currentTrack.coverArt)" />
        </div>
        <div class="player-info">
          <div class="player-title">{{ currentTrack.title }}</div>
          <div class="player-artist">{{ currentTrack.artist }}</div>
        </div>
      </div>
      <div class="player-controls">
        <div class="player-buttons">
          <button @click="prevTrack" style="background:none; border:none; font-size:20px;">⏮</button>
          <button class="play-pause-btn" @click="togglePlay">{{ isPlaying ? '⏸' : '▶' }}</button>
          <button @click="nextTrack" style="background:none; border:none; font-size:20px;">⏭</button>
        </div>
        <div class="progress-bar">
          <div class="progress-track" @click="seek">
            <div class="progress-fill" :style="{width: progressPct + '%'}"></div>
          </div>
        </div>
      </div>
      <div class="player-right">
        <button @click="showQueue = !showQueue" style="background:none; border:1px solid var(--border); padding:4px 8px; font-size:11px;">Queue</button>
      </div>
    </div>

  </div>
</div>

<script>
const { createApp, ref, computed, reactive, onMounted } = Vue;

createApp({
  setup() {
    const loggedIn = ref(false);
    const logging = ref(false);
    const mobileMenuOpen = ref(false);
    const loginError = ref('');
    const view = ref('folders');
    const loading = ref(false);

    const loginForm = reactive({ server: '', username: '', password: '', lastfmUser: '', lastfmKey: '' });
    const config = reactive({ server: '', username: '', password: '', lastfmUser: '', lastfmKey: '' });

    // Audio State
    const audio = new Audio();
    const isPlaying = ref(false);
    const currentTime = ref(0);
    const duration = ref(0);
    const currentTrack = ref(null);
    const queue = ref([]);
    const currentIndex = ref(-1);

    // Data State
    const currentDirItems = ref([]);
    const artistIndex = ref([]);
    const allAlbums = ref([]);
    const albumTracks = ref([]);
    const currentAlbum = ref(null);
    const recentScrobbles = ref([]);

    function hexEncode(s) {
      return Array.from(s).map(c => c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
    }

    function buildUrl(endpoint, params = {}) {
      const base = config.server.replace(/\/$/, '');
      const auth = `u=${encodeURIComponent(config.username)}&p=enc:${hexEncode(config.password)}&v=1.16.1&c=attic&f=json`;
      const extra = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
      return `${base}/rest/${endpoint}?${auth}${extra ? '&'+extra : ''}`;
    }

    async function api(endpoint, params = {}) {
      const res = await fetch(buildUrl(endpoint, params));
      const data = await res.json();
      return data['subsonic-response'];
    }

    async function login() {
      logging.value = true;
      Object.assign(config, loginForm);
      try {
        const res = await api('ping');
        if (res.status === 'ok') {
          loggedIn.value = true;
          localStorage.setItem('attic_config', JSON.stringify(config));
          loadFolders();
        } else {
          loginError.value = res.error?.message || 'Failed';
        }
      } catch (e) {
        loginError.value = 'Server connection failed';
      } finally {
        logging.value = false;
      }
    }

    function setView(v) {
      view.value = v;
      mobileMenuOpen.value = false;
      if (v === 'folders') loadFolders();
      if (v === 'artists') loadArtists();
      if (v === 'albums') loadAlbums();
    }

    async function loadFolders() {
      loading.value = true;
      const res = await api('getMusicDirectory', { id: 'root' });
      currentDirItems.value = res.directory?.child || [];
      loading.value = false;
    }

    async function loadArtists() {
      loading
